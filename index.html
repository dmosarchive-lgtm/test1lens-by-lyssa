<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lens By Lyssa Admin</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&family=Gochi+Hand&display=swap">
<style>
/* Admin panel: calm, clear, same family as the site. Deliberately single light theme. */
#admin-root{
  color-scheme:light;
  --paper:#FDFBF5; --card:#FFFFFF; --ink:#35415A; --soft:#6C7690; --line:#E4E1D8; --line2:#CFCABD;
  --pink:#F9C6D0; --pink-d:#D9667F; --lemon:#FFF1A8; --sky:#BFE0F5; --grass:#C6E7B8; --lav:#DCCFF4; --peach:#FFD8C2;
  --ok:#2E8B57; --warn:#B7791F; --bad:#C0405C;
  --disp:"Fredoka", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body:"Quicksand", "Trebuchet MS", system-ui, sans-serif;
  --hand:"Gochi Hand", "Comic Sans MS", cursive;
  font:600 16px/1.5 var(--body);color:var(--ink);background:var(--paper);min-height:100vh;
}
#admin-root *{box-sizing:border-box}
#admin-root [hidden]{display:none!important}
:where(#admin-root) :is(h1,h2,h3){font-family:var(--disp);font-weight:700;margin:0;line-height:1.15}
:where(#admin-root) p{margin:0}
:where(#admin-root) button{font:inherit;color:inherit}
#admin-root :focus-visible{outline:3px solid var(--pink-d);outline-offset:2px}
#admin-root .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:2px solid var(--ink);background:var(--pink);border-radius:999px;padding:9px 18px;font-family:var(--disp);font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);transition:transform .15s,background .2s}
#admin-root .btn:hover{transform:translateY(-1px)}
#admin-root .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
#admin-root .btn.ghost{background:var(--card)}
#admin-root .btn.small{padding:5px 12px;font-size:.88rem}
#admin-root .btn.danger{background:#FFE3E8;border-color:var(--bad);color:var(--bad)}
#admin-root .btn.yellow{background:var(--lemon)}

/* login */
.a-login{min-height:100vh;display:grid;place-items:center;padding:20px 16px}
.a-login .box{width:min(400px,100%);background:var(--card);border:2px solid var(--ink);border-radius:20px;padding:28px;box-shadow:8px 8px 0 var(--pink);display:grid;gap:14px}
.a-login h1{font-size:1.8rem}
.a-login .hello{font-family:var(--hand);font-size:1.4rem;color:var(--pink-d)}
.a-demo{font-size:.9rem;background:var(--lemon);border:2px dashed var(--ink);border-radius:12px;padding:8px 12px}

/* layout */
.a-app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.a-side{background:var(--card);border-right:2px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.a-brand{font-family:var(--disp);font-weight:700;font-size:1.15rem;padding:4px 10px 12px;display:flex;gap:8px;align-items:center}
.a-brand small{display:block;font-family:var(--hand);font-weight:400;color:var(--pink-d);font-size:1rem}
.a-nav{display:flex;flex-direction:column;gap:2px}
.a-nav button{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:9px 10px;border-radius:12px;cursor:pointer;font-weight:700}
.a-nav button i{width:12px;height:12px;border-radius:50%;background:var(--c);border:2px solid var(--ink);flex:none}
.a-nav button:hover{background:var(--paper)}
.a-nav button[aria-current="true"]{background:var(--c)}
.a-nav .badge{margin-left:auto;background:var(--pink-d);color:#fff;border-radius:999px;padding:0 8px;font-size:.8rem}
.a-side .foot{margin-top:auto;display:grid;gap:8px;padding:12px 6px 0}
.a-main{min-width:0;display:flex;flex-direction:column}
.a-top{position:sticky;top:0;z-index:20;background:rgba(253,251,245,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:2px solid var(--line);padding:12px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.a-top h2{font-size:1.4rem;margin-right:auto}
.pill{font-size:.85rem;border-radius:999px;padding:4px 12px;border:2px solid currentColor;font-weight:700}
.pill.ok{color:var(--ok)}.pill.dirty{color:var(--warn);background:#FFF7E0}.pill.demo{color:var(--soft)}
.a-body{padding:22px 24px 80px;max-width:900px;width:100%}
.a-intro{color:var(--soft);margin-bottom:18px;max-width:65ch}
@media (max-width:820px){
  .a-app{grid-template-columns:1fr}
  .a-side{position:static;height:auto;border-right:0;border-bottom:2px solid var(--line);padding:10px 12px}
  .a-nav{flex-direction:row;overflow-x:auto;scrollbar-width:none}
  .a-nav button{flex:none;padding:7px 10px}
  .a-side .foot{flex-direction:row;display:flex;flex-wrap:wrap;margin-top:6px;padding:6px 0 0}
  .a-top{padding:10px 16px}.a-body{padding:16px 16px 80px}
}

/* fields */
.group{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px;display:grid;gap:14px}
.group>h3{font-size:1.1rem}
.fld{display:grid;gap:5px}
.fld>label,.fld>.lbl{font-family:var(--disp);font-weight:600;font-size:.95rem}
.fld .help{font-size:.85rem;color:var(--soft);font-weight:600}
.fld input[type=text],.fld input[type=email],.fld input[type=number],.fld input[type=date],.fld input[type=time],.fld select,.fld textarea{font:600 1rem var(--body);color:var(--ink);background:var(--paper);border:2px solid var(--line2);border-radius:12px;padding:9px 12px;width:100%;max-width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--ink);background:#fff}
.fld textarea{min-height:80px;resize:vertical}
.money{display:flex;align-items:center;gap:6px}.money span{font-family:var(--disp);font-size:1.1rem}.money input{max-width:140px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:620px){.row2,.row3{grid-template-columns:1fr}}
.toggle{display:flex;align-items:center;gap:12px;cursor:pointer;font-family:var(--disp);font-weight:600}
.toggle input{appearance:none;width:48px;height:28px;border-radius:999px;background:var(--line2);position:relative;cursor:pointer;margin:0;flex:none;transition:background .2s}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.toggle input:checked{background:var(--ok)}.toggle input:checked::after{transform:translateX(20px)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:32px;height:32px;border-radius:50%;border:2px solid var(--ink);background:var(--c);cursor:pointer}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--ink)}
.photo{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.photo .thumb{width:112px;height:112px;border-radius:12px;border:2px solid var(--line2);object-fit:cover;background:var(--paper);flex:none}
.photo .sample{font-family:var(--hand);font-size:1rem;color:var(--soft)}
.photo .acts{display:flex;gap:8px;flex-wrap:wrap}
.photo.busy .thumb{opacity:.4}
.list{display:grid;gap:10px}
.item{border:2px solid var(--line2);border-radius:14px;background:var(--paper)}
.item>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 12px}
.item>summary::-webkit-details-marker{display:none}
.item>summary img{width:44px;height:44px;border-radius:8px;object-fit:cover;border:2px solid var(--line2);flex:none}
.item>summary .t{font-family:var(--disp);font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item>summary .sub{font-size:.85rem;color:var(--soft)}
.item>summary .chev{transition:transform .2s}
.item[open]>summary .chev{transform:rotate(90deg)}
.item .inside{padding:4px 14px 14px;display:grid;gap:14px;border-top:2px dashed var(--line2)}
.item .tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;padding-top:6px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--c);border:2px solid var(--ink);flex:none}
.status{font-size:.78rem;border-radius:999px;padding:2px 10px;border:2px solid var(--ink);background:var(--c)}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.anote{background:var(--sky);border:2px solid var(--ink);border-radius:14px;padding:12px 14px;font-size:.95rem}
.anote.warm{background:var(--lemon)}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slots button{border:2px solid var(--ink);border-radius:999px;padding:6px 12px;background:#fff;cursor:pointer;font-family:var(--disp);font-weight:600;font-size:.9rem}
.slots button.taken{background:var(--lemon);text-decoration:line-through}
.slots button.paid{background:var(--grass);cursor:default}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--soft)}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);margin-right:5px;vertical-align:-1px;background:var(--c)}

/* inbox */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters button{border:2px solid var(--ink);border-radius:999px;background:#fff;padding:5px 14px;cursor:pointer;font-weight:700}
.filters button[aria-pressed="true"]{background:var(--ink);color:#fff}
.msg{background:var(--card);border:2px solid var(--line2);border-radius:16px;padding:14px 16px;display:grid;gap:8px;margin-bottom:12px}
.msg.done{opacity:.6}
.msg .head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.msg .head b{font-family:var(--disp);font-size:1.1rem}
.msg .when{margin-left:auto;font-size:.85rem;color:var(--soft)}
.kind{font-size:.78rem;border-radius:999px;padding:2px 10px;border:2px solid var(--ink)}
.kind.payment{background:var(--grass)}.kind.inquiry{background:var(--pink)}.kind.waitlist{background:var(--sky)}
.msg dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:.95rem}
.msg ul.pays{list-style:none;margin:8px 0 0;padding:8px 12px;background:#F4FBEF;border:2px dashed #BFE3B0;border-radius:12px;font-size:.9rem}.msg ul.pays li::before{content:"♡ ";color:var(--ok)}
.msg dt{color:var(--soft)}.msg dd{margin:0;overflow-wrap:anywhere}
.msg .quote{background:var(--paper);border-radius:10px;padding:8px 12px;font-family:var(--hand);font-size:1.15rem;white-space:pre-wrap}
.msg .acts{display:flex;gap:8px;flex-wrap:wrap}
.alert{border:2px solid var(--bad);background:#FFE3E8;color:var(--bad);border-radius:12px;padding:8px 12px;font-weight:700}
.empty{text-align:center;color:var(--soft);padding:40px 10px;font-family:var(--hand);font-size:1.4rem}
.help h3{margin:18px 0 6px}.help p,.help li{color:var(--ink);max-width:68ch}.help ul{padding-left:20px;margin:6px 0}
.a-toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,calc(100% + 40px));visibility:hidden;background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;z-index:90;font-weight:700;transition:transform .35s,visibility .35s;max-width:calc(100% - 32px);text-align:center}
.a-toast.show{transform:translate(-50%,0);visibility:visible}
.a-toast.bad{background:var(--bad)}
@media (prefers-reduced-motion:reduce){#admin-root *{transition:none!important;animation:none!important}}
</style>


</head>
<body>
<div id="admin-root">
  <div class="a-login" id="loginView">
    <form class="box" id="loginForm">
      <p class="hello">welcome back ✿</p>
      <h1 id="loginBrand">Lens By Lyssa</h1>
      <p style="color:var(--soft)">Sign in to update your website.</p>
      <div class="fld"><label for="pw">Password</label><input type="password" id="pw" autocomplete="current-password" style="font:600 1rem var(--body);border:2px solid var(--line2);border-radius:12px;padding:10px 12px"></div>
      <p class="alert" id="loginErr" hidden></p>
      <button class="btn" type="submit" id="loginBtn">Sign in</button>
      <p class="a-demo" id="loginDemo" hidden>Preview mode: the real sign-in turns on once the site is live. Any password works here, and changes are saved in this browser only.</p>
    </form>
  </div>

  <div class="a-app" id="appView" hidden>
    <aside class="a-side">
      <div class="a-brand"><span class="dot" style="--c:var(--pink)"></span><div><span id="sideBrand">Lens By Lyssa</span><small>admin</small></div></div>
      <nav class="a-nav" id="nav" aria-label="Admin sections"></nav>
      <div class="foot"><a class="btn ghost small" id="viewSite" href="/" target="_blank" rel="noopener">View site ↗</a><button class="btn ghost small" id="signOut" type="button">Sign out</button></div>
    </aside>
    <div class="a-main">
      <div class="a-top"><h2 id="secTitle"></h2><span class="pill ok" id="savePill">All changes saved</span><button class="btn" id="saveBtn" type="button" disabled>Save changes</button></div>
      <div class="a-body" id="body"></div>
    </div>
  </div>
  <div class="a-toast" id="aToast" role="status" aria-live="polite"></div>
  <input type="file" id="filePick" accept="image/jpeg,image/png,image/webp" hidden>
  <input type="file" id="filePickMany" accept="image/jpeg,image/png,image/webp" multiple hidden>
</div>

/* ---------- path helpers ---------- */
const getP=(o,p)=>p.split(".").reduce((a,k)=>a==null?a:a[k],o);
function setP(o,p,v){const ks=p.split(".");let a=o;ks.slice(0,-1).forEach(k=>{a=a[k]});a[ks[ks.length-1]]=v}
function markDirty(){dirty=true;updatePill()}
function updatePill(){const p=$("savePill");p.className="pill "+(dirty?"dirty":LIVE?"ok":"demo");p.textContent=dirty?"Unsaved changes":LIVE?"All changes saved":"Preview mode · saved in this browser";$("saveBtn").disabled=!dirty}
addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue=""}});

/* ---------- photos: resize in the browser, then upload ---------- */
function resizeImage(file,maxSide,quality){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{const s=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>b?res(b):rej(new Error("Couldn't read that photo.")),"image/jpeg",quality)};img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("That file doesn't look like a photo."))};img.src=url})}
const blobToDataUrl=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)});
async function uploadPhoto(file){
  if(!/^image\/(jpeg|png|webp)$/.test(file.type))throw new Error("Please choose a JPG, PNG or WebP photo.");
  if(LIVE){const blob=await resizeImage(file,2200,.86);const r=await LBL.api.upload(token,blob);return r.url}
  const blob=await resizeImage(file,1000,.78);return blobToDataUrl(blob);
}
function pickFiles(many){return new Promise(res=>{const inp=$(many?"filePickMany":"filePick");inp.value="";inp.onchange=()=>res([...inp.files]);inp.click()})}

/* ---------- field renderers ---------- */
function field(f,obj,path,ctx){
  if(f.row||f.row3){const d=document.createElement("div");d.className=f.row3?"row3":"row2";(f.row||f.row3).forEach(x=>d.appendChild(field(x,obj,path,ctx)));return d}
  if(f.type==="slots")return slotsField(obj,ctx);
  if(f.type==="note"){const n=document.createElement("p");n.className="help";n.textContent=f.text;return n}
  if(f.type==="calendar")return calendarField();
  const full=path?path+"."+f.k:f.k,val=getP(obj,f.k),id="f_"+full.replace(/[^a-z0-9]/gi,"_");
  const w=document.createElement("div");w.className="fld";
  if(f.showIf&&!f.showIf(C)){w.hidden=true}
  const label=t=>`<label for="${id}">${esc(t)}</label>`,help=f.help?`<span class="help">${esc(f.help)}</span>`:"";
  const set=v=>{setP(obj,f.k,v);markDirty();if(ctx&&ctx.onChange)ctx.onChange()};
  switch(f.type){
    case "textarea":w.innerHTML=label(f.label)+`<textarea id="${id}" placeholder="${esc(f.placeholder||"")}">${esc(val)}</textarea>`+help;w.querySelector("textarea").oninput=e=>set(e.target.value);break;
    case "lines":w.innerHTML=label(f.label)+`<textarea id="${id}" rows="4">${esc((val||[]).join("\n"))}</textarea>`+help;w.querySelector("textarea").oninput=e=>set(e.target.value.split("\n").map(s=>s.trim()).filter(Boolean));break;
    case "number":w.innerHTML=label(f.label)+`<input type="number" id="${id}" min="0" value="${esc(val)}">`+help;w.querySelector("input").oninput=e=>set(Number(e.target.value)||0);break;
    case "money":w.innerHTML=label(f.label)+`<div class="money"><span>$</span><input type="number" id="${id}" min="0" step="1" value="${esc(val)}"></div>`+help;w.querySelector("input").oninput=e=>set(Math.max(0,Number(e.target.value)||0));break;
    case "date":case "time":case "email":w.innerHTML=label(f.label)+`<input type="${f.type}" id="${id}" value="${esc(val)}">`+help;w.querySelector("input").oninput=e=>set(e.target.value);break;
    case "select":w.innerHTML=label(f.label)+`<select id="${id}">${f.options.map(([v,t])=>`<option value="${esc(v)}" ${v===val?"selected":""}>${esc(t)}</option>`).join("")}</select>`+help;w.querySelector("select").onchange=e=>{set(e.target.value);if(f.rerender)render()};break;
    case "toggle":w.innerHTML=`<label class="toggle"><input type="checkbox" id="${id}" ${val?"checked":""}>${esc(f.label)}</label>`+help;w.querySelector("input").onchange=e=>{set(e.target.checked);render()};break;
    case "color":w.innerHTML=`<span class="lbl">${esc(f.label)}</span><div class="swatches" role="group" aria-label="${esc(f.label)}">${COLORS.map(c=>`<button type="button" style="--c:${c}" aria-label="Color ${c}" aria-pressed="${c===val}" data-c="${c}"></button>`).join("")}</div>`;
      w.querySelectorAll("button").forEach(b=>b.onclick=()=>{set(b.dataset.c);w.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b))});break;
    case "photo":{const kind=f.kindKey?obj[f.kindKey]:(f.kind||obj.kind||obj.cat||"family");const seed=f.seed||7;
      const draw=()=>{const has=LBL.safeUrl(getP(obj,f.k));w.innerHTML=`<span class="lbl">${esc(f.label)}</span><div class="photo"><img class="thumb" alt="" src="${LBL.photoOr(getP(obj,f.k),kind,seed,240,240)}"><div style="display:grid;gap:6px">${has?"":'<span class="sample">sample picture — upload yours!</span>'}<div class="acts"><button class="btn small yellow" type="button" data-up>${has?"Replace photo":"Upload photo"}</button>${has?'<button class="btn small ghost" type="button" data-rm>Remove</button>':""}</div></div></div>`+help;
        w.querySelector("[data-up]").onclick=async()=>{const [file]=await pickFiles(false);if(!file)return;w.querySelector(".photo").classList.add("busy");w.querySelector("[data-up]").textContent="Uploading…";
          try{const url=await uploadPhoto(file);setP(obj,f.k,url);markDirty();if(ctx&&ctx.onChange)ctx.onChange();draw();toast("Photo added. Don't forget to save!")}catch(e){toast(e.message,true);draw()}};
        const rm=w.querySelector("[data-rm]");if(rm)rm.onclick=()=>{setP(obj,f.k,"");markDirty();if(ctx&&ctx.onChange)ctx.onChange();draw()}};
      draw();break}
    case "list":return listField(f,obj);
    default:w.innerHTML=label(f.label)+`<input type="text" id="${id}" value="${esc(val)}" placeholder="${esc(f.placeholder||"")}">`+help;w.querySelector("input").oninput=e=>set(e.target.value);
  }
  return w;
}
const openItems=new Set();
function listField(f,obj){
  const arr=getP(obj,f.k)||[];setP(obj,f.k,arr);
  const w=document.createElement("div");w.className="list";
  arr.forEach((it,i)=>{
    const d=document.createElement("details");d.className="item";const key=f.k+":"+(it.id||i);if(openItems.has(key))d.open=true;
    d.ontoggle=()=>{d.open?openItems.add(key):openItems.delete(key)};
    const sum=document.createElement("summary");
    const head=()=>{const th=f.thumb?f.thumb(it,i):null;sum.innerHTML=`<span class="chev">▸</span>${th?`<img alt="" src="${LBL.photoOr(th[0],th[1],th[2],120,120)}">`:""}${f.dot?`<span class="dot" style="--c:${esc(f.dot(it))}"></span>`:""}<span class="t">${esc(f.itemTitle?f.itemTitle(it,i):"Item "+(i+1))}${f.itemSub?`<br><span class="sub">${esc(f.itemSub(it))}</span>`:""}</span>${f.status?`<span class="status" style="--c:${STATUS_C[f.status(it)]||"#fff"}">${esc((STATUS.find(s=>s[0]===f.status(it))||[,""])[1].split(" (")[0])}</span>`:""}`};
    head();d.appendChild(sum);
    const inside=document.createElement("div");inside.className="inside";
    const ctx={onChange:head,item:it};
    f.item.forEach(x=>inside.appendChild(field(x,it,"",ctx)));
    if(!f.fixed){const tools=document.createElement("div");tools.className="tools";
      tools.innerHTML=`<button class="btn small ghost" type="button" data-u ${i===0?"disabled":""}>Move up</button><button class="btn small ghost" type="button" data-d ${i===arr.length-1?"disabled":""}>Move down</button><button class="btn small danger" type="button" data-x>Delete</button>`;
      tools.querySelector("[data-u]").onclick=()=>{[arr[i-1],arr[i]]=[arr[i],arr[i-1]];markDirty();render()};
      tools.querySelector("[data-d]").onclick=()=>{[arr[i+1],arr[i]]=[arr[i],arr[i+1]];markDirty();render()};
      const x=tools.querySelector("[data-x]");x.onclick=()=>{if(x.dataset.sure){arr.splice(i,1);markDirty();render();toast("Deleted. Save to make it official.")}else{x.dataset.sure=1;x.textContent="Tap again to delete";setTimeout(()=>{x.dataset.sure="";x.textContent="Delete"},3000)}};
      inside.appendChild(tools)}
    d.appendChild(inside);w.appendChild(d)});
  if(!f.fixed){const row=document.createElement("div");row.className="addrow";
    const add=document.createElement("button");add.className="btn small";add.type="button";add.textContent="+ "+(f.addLabel||"Add");
    add.onclick=()=>{const n=f.add();arr.push(n);openItems.add(f.k+":"+(n.id||arr.length-1));markDirty();render()};row.appendChild(add);
    if(f.bulk){const many=document.createElement("button");many.className="btn small yellow";many.type="button";many.textContent="+ Add several photos at once";
      many.onclick=async()=>{const files=await pickFiles(true);if(!files.length)return;many.disabled=true;let done=0;
        for(const file of files){many.textContent=`Uploading ${++done} of ${files.length}…`;try{const url=await uploadPhoto(file);const n=f.add();n.photo=url;if("title" in n)n.title=file.name.replace(/\.[^.]+$/,"").replace(/[-_]+/g," ");else if("caption" in n)n.caption="";arr.push(n)}catch(e){toast(e.message,true)}}
        markDirty();render();toast(`${files.length} photo${files.length>1?"s":""} added. Add titles, then save!`)};row.appendChild(many)}
    w.appendChild(row)}
  return w;
}
function slotsField(m,ctx){
  const w=document.createElement("div");w.className="fld";
  const draw=()=>{const all=LBL.slotsFor(m),taken=new Set(m.taken||[]),paid=new Set(m.booked||[]);
    w.innerHTML=`<span class="lbl">Time slots</span><span class="help">Tap a time to mark it booked (for people who paid you another way). Green times were paid online; manage those in your Inbox.</span><div class="slots">${all.map(s=>`<button type="button" data-s="${s}" class="${paid.has(s)?"paid":taken.has(s)?"taken":""}" ${paid.has(s)?"disabled":""} aria-pressed="${taken.has(s)}">${fmt12(s)}</button>`).join("")||'<span class="help">Set a first and last start time to create slots.</span>'}</div><div class="legend"><span style="--c:#fff">open</span><span style="--c:var(--lemon)">booked by you</span><span style="--c:var(--grass)">paid online</span></div>`;
    w.querySelectorAll("button[data-s]").forEach(b=>b.onclick=()=>{const s=b.dataset.s;m.taken=m.taken||[];const i=m.taken.indexOf(s);i>=0?m.taken.splice(i,1):m.taken.push(s);markDirty();draw()})};
  draw();const prev=ctx.onChange;ctx.onChange=()=>{prev&&prev();draw()};return w;
}
const fmt12=hm=>{let [h,m]=String(hm).split(":").map(Number);const ap=h>=12?"pm":"am";h=h%12||12;return `${h}:${String(m).padStart(2,"0")}${ap}`};

/* ---------- inbox ---------- */
async function loadInbox(){
  if(LIVE){try{inbox=(await LBL.api.inbox(token)).items}catch(e){if(e.status===401)return signOut(true);toast(e.message,true)}}
  else{try{inbox=JSON.parse(LBL.ls.get(LBL.DEMO_INBOX)||"[]")}catch(_){inbox=[]}}
  renderNav();if(section==="inbox")render();
}
function saveDemoInbox(){LBL.ls.set(LBL.DEMO_INBOX,JSON.stringify(inbox))}
function inboxView(){
  const wrap=document.createElement("div");
  const counts={all:inbox.length,payment:0,inquiry:0,waitlist:0};inbox.forEach(m=>{const k=m.kind==="mini-request"?"inquiry":m.kind;counts[k]=(counts[k]||0)+1});
  const F=[["all","Everything"],["inquiry","Booking notes & requests"],["payment","Payments"],["waitlist","Waitlist"]];
  wrap.innerHTML=`<div class="filters" role="group" aria-label="Show">${F.map(([k,t])=>`<button type="button" data-f="${k}" aria-pressed="${k===inboxFilter}">${t} (${counts[k]||0})</button>`).join("")}<button type="button" data-refresh style="margin-left:auto">Refresh</button></div>`;
  wrap.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{inboxFilter=b.dataset.f;render()});
  wrap.querySelector("[data-refresh]").onclick=()=>loadInbox().then(()=>toast("Inbox up to date"));
  const list=inbox.filter(m=>inboxFilter==="all"||m.kind===inboxFilter||(inboxFilter==="inquiry"&&m.kind==="mini-request"));
  if(!list.length){wrap.insertAdjacentHTML("beforeend",`<p class="empty">nothing here yet ✿</p>`);return wrap}
  list.forEach(m=>{const d=document.createElement("div");d.className="msg"+(m.handled?" done":"");
    const when=new Date(m.createdAt).toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
    const title=m.kind==="payment"?`$${LBL.money(m.amount)} from ${m.name||m.email}`:m.kind==="waitlist"?`${m.email} joined the ${m.mini} list`:m.kind==="mini-request"?`${m.name} requested ${m.mini} at ${fmt12(m.slot)}`:`${m.name} wants a ${m.session||""} session`;
    const rows=[["Email",m.email],["Phone",m.phone],["Mini",m.mini&&m.slot?`${m.mini} · ${m.date} at ${fmt12(m.slot)}`:""],["Package",m.package?(m.package+(m.deposit==="yes"?" (deposit)":m.kind==="payment"?" (paid in full)":"")):""],["Add-ons",m.addons],["Who's coming",m.people],["Date hoped for",m.kind!=="payment"||!m.slot?m.date:""],["Editing style",m.style]].filter(r=>r[1]);
    d.innerHTML=`<div class="head"><span class="kind ${m.kind==="mini-request"?"inquiry":m.kind}">${m.kind==="payment"?"payment":m.kind==="waitlist"?"waitlist":m.kind==="mini-request"?"mini request":"booking note"}</span><b>${esc(title)}</b><span class="when">${esc(when)}</span></div>
      ${m.doubleBooked?'<p class="alert">Heads up: this time was already booked by someone else. Reach out to reschedule, or refund in Stripe.</p>':""}
      ${m.slotReleased?'<p class="anote warm">You released this time slot, so it is open for booking again.</p>':""}
      <dl>${rows.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
      ${m.message?`<p class="quote">${esc(m.message)}</p>`:""}
      <div class="acts"><button class="btn small ghost" type="button" data-copy>Copy email</button><button class="btn small ${m.handled?"ghost":""}" type="button" data-done>${m.handled?"Mark as not done":"Mark as done ✓"}</button>${(m.kind==="inquiry"||m.kind==="mini-request")&&!m.bookingId?'<button class="btn small yellow" type="button" data-sched>Schedule &amp; send pay link</button>':""}${m.bookingId?'<button class="btn small ghost" type="button" data-see>See booking</button>':""}${m.kind==="payment"&&m.slot&&!m.slotReleased&&!m.bookingId?'<button class="btn small ghost" type="button" data-release>Free up this time slot</button>':""}<button class="btn small danger" type="button" data-del>Delete</button></div>`;
    d.querySelector("[data-copy]").onclick=async()=>{try{await navigator.clipboard.writeText(m.email);toast("Email copied")}catch(_){toast(m.email)}};
    d.querySelector("[data-done]").onclick=async()=>{m.handled=!m.handled;if(LIVE){try{await LBL.api.inboxPatch(token,{key:m.key,handled:m.handled})}catch(e){toast(e.message,true)}}else saveDemoInbox();renderNav();render()};
    const sch=d.querySelector("[data-sched]");if(sch)sch.onclick=()=>openBookingForm(prefillFromMessage(m));
    const see=d.querySelector("[data-see]");if(see)see.onclick=()=>{bFilter="all";highlight=m.bookingId;go("bookings")};

  return wrap}
function calendarField(){const w=document.createElement("div");w.className="fld";
  const draw=(info,busy)=>{w.innerHTML=`<span class="lbl">Connection</span>${!LIVE?'<p class="help">Preview mode: connect Google Calendar once the site is live (see the setup guide).</p>':!info?'<p class="help">Checking…</p>':!info.configured?'<p class="help">Not connected yet. Whoever set up your site can connect it in about 15 minutes using the setup guide. Once connected, bookings appear on your calendar and busy times are hidden from mini sessions.</p>':info.ok?`<p class="help" style="color:var(--ok)">Connected to ${esc(info.calendarId)} ✓</p>`:`<p class="alert">Connected, but something's wrong: ${esc(info.error)}</p>`}
    ${LIVE&&info&&info.configured?`<div class="addrow"><button class="btn small ghost" type="button" data-test ${busy?"disabled":""}>${busy?"Testing…":"Send a test event"}</button></div>`:""}`;
    const t=w.querySelector("[data-test]");if(t)t.onclick=async()=>{draw(info,true);try{const r=await LBL.api.calendar(token,true);calInfo=r;draw(r);toast(r.ok?"Test worked! Your calendar is connected.":"Test failed. See the message.",!r.ok)}catch(e){draw(info);toast(e.message,true)}}};
  draw(calInfo);if(LIVE&&!calInfo)LBL.api.calendar(token).then(r=>{calInfo=r;draw(r)}).catch(e=>draw({configured:true,ok:false,error:e.message}));
  return w}
/* ---------- help ---------- */
function helpView(){const d=document.createElement("div");d.className="help group";d.innerHTML=`
<h3>Changing words or photos</h3><p>Pick a section on the left, make your changes, then press <b>Save changes</b> at the top. Your site updates right away.</p>
<h3>Photos</h3><ul><li>Upload photos straight from your phone or computer. They're resized for the web automatically.</li><li>On the photo board, use <b>Add several photos at once</b> to upload a whole batch, then give each one a title and type.</li><li>Tip: portrait (tall) photos look best on the board and collage.</li></ul>
<h3>Payments</h3><ul><li>Clients pay through Stripe. You'll get an email from Stripe for every payment, and it shows up here in your Inbox.</li><li>Money lands in your bank account on Stripe's normal schedule (usually 2 business days).</li><li>Refunds are done in your Stripe dashboard. If you refund a mini session, press <b>Free up this time slot</b> on that payment in your Inbox.</li></ul>
<h3>Booking a session (message first)</h3><ul><li>When someone sends a note, press <b>Schedule &amp; send pay link</b> on it in your Inbox, or press <b>+ New booking</b> under Bookings.</li><li>Set the date, time and amount you agreed on. You'll get a personal pay link. Tap <b>Copy message with link</b> and text or email it.</li><li>The link opens their own invoice page. They can pay there, and it shows what's paid and what's left.</li><li><b>Deposits:</b> after the deposit the booking turns orange ("Deposit paid"). Send the same link again for the balance. It updates itself.</li><li>Prefer an email from Stripe? Press <b>Email a Stripe invoice instead</b>. Stripe adds a 0.4% fee for those. If they pay one way, the other is cancelled automatically so nobody pays twice.</li><li>When they pay in full, the booking turns green, shows up in your Inbox, and turns green on your Google Calendar.</li><li>Paid in cash or Venmo? Press <b>Mark … paid</b>.</li></ul>
<h3>Mini sessions</h3><ul><li>Set the status to <b>Coming soon</b> to collect waitlist emails, then switch to <b>Open for booking</b> when you're ready.</li><li>Paid times turn green and can't be double-booked. Tap a time to block it yourself (for cash or Venmo bookings).</li><li>Set a finished mini to <b>Hidden</b> to remove it from the site.</li></ul>
${LIVE?"":`<h3>Preview mode</h3><p>You're trying the admin panel before the site is live. Changes are saved in this browser only.</p><p><button class="btn small danger" type="button" id="resetDemo">Reset to the sample content</button></p>`}`;
  const r=d.querySelector("#resetDemo");if(r)r.onclick=()=>{if(!r.dataset.sure){r.dataset.sure=1;r.textContent="Tap again to reset everything";return}LBL.ls.del(LBL.DEMO_KEY);LBL.ls.del(LBL.DEMO_INBOX);C=LBL.demoContent();inbox=[];dirty=false;updatePill();render();toast("Back to the sample content")};
  return d}

/* ---------- screens ---------- */
function renderNav(){const n=$("nav");const unread=inbox.filter(m=>!m.handled).length;n.innerHTML="";
  SECTIONS.forEach(s=>{const b=document.createElement("button");b.type="button";b.style.setProperty("--c",s.c);b.setAttribute("aria-current",s.id===section);b.innerHTML=`<i></i>${esc(s.title)}${s.id==="inbox"&&unread?`<span class="badge">${unread}</span>`:""}${s.id==="bookings"&&bookings.filter(waiting).length?`<span class="badge" style="background:var(--warn)">${bookings.filter(waiting).length}</span>`:""}`;b.onclick=()=>{section=s.id;render();renderNav();scrollTo({top:0})};n.appendChild(b)})}
function render(){const s=SECTIONS.find(x=>x.id===section);$("secTitle").textContent=s.title;const body=$("body");body.innerHTML="";
  if(s.intro){const p=document.createElement("p");p.className="a-intro";p.textContent=s.intro;body.appendChild(p)}
  if(section==="pricing"&&!LIVE)body.insertAdjacentHTML("beforeend",'<p class="anote" style="margin-bottom:16px">Payments switch on when the site goes live with a Stripe account. The prices you set here are exactly what clients are charged.</p>');
  if(section==="inbox"){body.appendChild(inboxView());return}
  if(section==="bookings"){body.appendChild(bookingsView());return}
  if(section==="help"){body.appendChild(helpView());return}
  s.groups.forEach(g=>{const box=document.createElement("div");box.className="group";box.innerHTML=`<h3>${esc(g.title)}</h3>`;g.fields.forEach(f=>box.appendChild(field(f,C,"")));body.appendChild(box)});
  $("sideBrand").textContent=C.brand.name||"My site";}

/* ---------- save ---------- */
async function save(){const b=$("saveBtn");b.disabled=true;b.textContent="Saving…";
  try{
    if(LIVE){await LBL.api.save(token,C)}
    else{const copy=structuredClone(C);(copy.minis||[]).forEach(m=>delete m.booked);if(!LBL.ls.set(LBL.DEMO_KEY,JSON.stringify(copy)))throw new Error("This browser's preview storage is full. Try fewer or smaller photos in preview mode.")}
    dirty=false;updatePill();toast(LIVE?"Saved! Your site is updated.":"Saved in this browser (preview mode).")
  }catch(e){if(e.status===401){toast("Please sign in again. Your changes are still here.",true);return showLogin(true)}toast(e.message,true);updatePill()}
  finally{b.textContent="Save changes";b.disabled=!dirty}}
$("saveBtn").onclick=save;
addEventListener("keydown",e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="s"&&!$("appView").hidden){e.preventDefault();if(dirty)save()}});

/* ---------- sign in / out ---------- */
function showLogin(keepContent){$("appView").hidden=true;$("loginView").hidden=false;$("loginDemo").hidden=LIVE;$("pw").focus();if(!keepContent)C=null}
async function enter(){
  if(!C){const live=await LBL.api.content();C=live||LBL.demoContent()}
  $("loginView").hidden=true;$("appView").hidden=false;$("loginBrand").textContent=C.brand.name;
  if(!LIVE){$("viewSite").removeAttribute("target");$("viewSite").href=window.__ADMIN_EMBEDDED?"#hi":"../"}
  updatePill();renderNav();render();loadInbox();loadBookings();
}
function signOut(expired){LBL.ls.del(TOKEN_KEY);token=null;if(expired)toast("Please sign in again.",true);showLogin()}
$("signOut").onclick=()=>{if(dirty&&!$("signOut").dataset.sure){$("signOut").dataset.sure=1;$("signOut").textContent="Unsaved changes! Tap again";return}dirty=false;signOut()};
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();const err=$("loginErr");err.hidden=true;const pw=$("pw").value;
  if(!LIVE){enter();return}
  $("loginBtn").disabled=true;$("loginBtn").textContent="Signing in…";
  try{const r=await LBL.api.login(pw);token=r.token;LBL.ls.set(TOKEN_KEY,token);$("pw").value="";await enter()}
  catch(x){err.textContent=x.message;err.hidden=false}
  finally{$("loginBtn").disabled=false;$("loginBtn").textContent="Sign in"}});

(async()=>{
  const live=await LBL.api.content();LIVE=!!live;if(live)C=live;
  $("loginBrand").textContent=(C||LBL.demoContent()).brand.name;
  token=LBL.ls.get(TOKEN_KEY);
  if(LIVE&&token){enter()}else showLogin(true);
})();
})();
</script>

</body>
</html>
